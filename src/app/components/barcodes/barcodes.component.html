<app-page-layout>
  <!-- Loading Overlay -->
  <div *ngIf="loading" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255, 255, 255, 0.9); z-index: 9999; display: flex; align-items: center; justify-content: center;">
    <div class="text-center">
      <div class="spinner-border text-primary" style="width: 3rem; height: 3rem;" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
      <p class="mt-3 fw-semibold text-muted">Loading barcodes...</p>
    </div>
  </div>
  
  <div class="container-fluid">
    <div class="mb-4 d-flex align-items-center justify-content-between">
      <div>
        <h1 class="display-6 fw-bold">Barcodes Management</h1>
            <p class="text-muted">Generate and manage product barcodes</p>
          </div>
          <div class="d-flex gap-2">
            <button class="btn btn-success shadow" *ngIf="isAdmin() || isCashier()" (click)="showCreateForm()">
              <i class="fas fa-plus me-2"></i>Add Barcode
            </button>
            <button class="btn btn-info shadow" *ngIf="isAdmin() || isCashier()" (click)="generateBarcode()">
              <i class="fas fa-barcode me-2"></i>Generate Barcode
            </button>
          </div>
        </div>

        <div class="card shadow-sm mb-4" *ngIf="showForm">
          <div class="card-header bg-gradient">
            <h3 class="mb-0"><i class="fas fa-barcode me-2"></i>{{ editingBarcode ? 'Edit Barcode' : 'Add New Barcode' }}</h3>
          </div>
          <div class="card-body">
            <form (ngSubmit)="saveBarcode()">
              <div class="mb-3">
                <label class="form-label fw-semibold"><i class="fas fa-hashtag me-2"></i>Barcode Value *</label>
                <input type="text" class="form-control" [(ngModel)]="barcodeForm.barCode1" name="barcode" placeholder="Enter barcode value" required />
              </div>
              <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary px-4"><i class="fas fa-save me-2"></i>{{ editingBarcode ? 'Update' : 'Create' }}</button>
                <button type="button" class="btn btn-outline-danger px-4" (click)="resetForm()"><i class="fas fa-times me-2"></i>Cancel</button>
              </div>
            </form>
          </div>
        </div>

        <div class="card shadow-sm mb-4" *ngIf="isAdmin() || isCashier()">
          <div class="card-header bg-gradient">
            <h3 class="mb-0"><i class="fas fa-magic me-2"></i>Generate Barcode</h3>
          </div>
          <div class="card-body">
            <form (ngSubmit)="generateBarcode()">
              <div class="row g-3">
                <div class="col-md-6">
                  <label class="form-label fw-semibold"><i class="fas fa-edit me-2"></i>Custom Value (optional)</label>
                  <input type="text" class="form-control" [(ngModel)]="generateForm.value" name="value" placeholder="Leave empty for auto-generation" />
                </div>
                <div class="col-md-6">
                  <label class="form-label fw-semibold"><i class="fas fa-box me-2"></i>Product ID (optional)</label>
                  <input type="number" class="form-control" [(ngModel)]="generateForm.productId" name="productId" placeholder="Enter product ID" />
                </div>
              </div>
              <div class="mt-3">
                <button type="submit" class="btn btn-info px-4"><i class="fas fa-magic me-2"></i>Generate</button>
              </div>
            </form>
          </div>
        </div>

        <div class="card shadow-sm">
          <div class="card-header bg-white">
            <h3 class="mb-0"><i class="fas fa-list me-2"></i>Barcodes List ({{ barcodes.length }})</h3>
          </div>
          <div class="card-body p-0">
            <div class="table-responsive">
              <table class="table table-hover mb-0">
                <thead class="table-light">
                  <tr>
                    <th class="fw-semibold"><i class="fas fa-hashtag me-2"></i>ID</th>
                    <th class="fw-semibold"><i class="fas fa-barcode me-2"></i>Barcode</th>
                    <th *ngIf="isAdmin()" class="fw-semibold text-center"><i class="fas fa-cog me-2"></i>Actions</th>
                  </tr>
                </thead>
                <tbody>
                  <tr *ngFor="let barcode of barcodes" class="align-middle">
                    <td class="fw-medium">#{{ barcode.barCodeId }}</td>
                    <td><span class="badge bg-primary fs-6">{{ barcode.barCode1 }}</span></td>
                    <td *ngIf="isAdmin()" class="text-center">
                      <div class="btn-group" role="group">
                        <button class="btn btn-sm btn-primary" (click)="showEditForm(barcode)" title="Edit"><i class="fas fa-edit"></i></button>
                        <button class="btn btn-sm btn-danger" (click)="deleteBarcode(barcode.barCodeId)" title="Delete"><i class="fas fa-trash"></i></button>
                      </div>
                    </td>
                  </tr>
                  <tr *ngIf="barcodes.length === 0">
                    <td colspan="3" class="text-center text-muted py-4">
                      <i class="fas fa-inbox fa-3x mb-3 d-block"></i>
                      <p class="mb-0">No barcodes found</p>
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
  </div>
</app-page-layout>
